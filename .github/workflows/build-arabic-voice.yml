name: Build Local Arabic Voice
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arabic-voice.yml'
      - 'queue-audio-entry.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle Nabra Arabic TTS into a local website module
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Oddadmix/nabra-tts.git /tmp/nabra-tts
          cd /tmp/nabra-tts
          npm install --ignore-scripts
          npm run build
          cd "$GITHUB_WORKSPACE"
          npm install --no-save --ignore-scripts esbuild@0.25.12
          mkdir -p node_modules
          ln -s /tmp/nabra-tts node_modules/nabra-tts
          ./node_modules/.bin/esbuild queue-audio-entry.mjs --bundle --platform=browser --format=esm --target=es2022 --minify --outfile=queue-nabra-bundle.js
          test -s queue-nabra-bundle.js
          if grep -q 'https://cdn.jsdelivr.net/npm/nabra-tts' queue-nabra-bundle.js; then exit 1; fi
      - name: Commit bundled module
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue-nabra-bundle.js
          if ! git diff --cached --quiet; then
            git commit -m "Build self-hosted Arabic queue voice module"
            git push
          fi
